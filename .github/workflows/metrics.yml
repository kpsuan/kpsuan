name: Metrics
# One dashboard image (stats, a 3D contribution calendar, languages without Jupyter's huge notebook files),
# rebuilt daily and committed as metrics.svg. Needs a token secret: METRICS_TOKEN (see README of lowlighter/metrics).
on:
  schedule:
    - cron: "0 16 * * *" # midnight in Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kpsuan
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
